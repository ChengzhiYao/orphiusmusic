<!doctype html>
<html lang="ja" data-sub="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
{{HEAD}}
<script defer src="/_vercel/insights/script.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/scene/style.css?v=3">
</head>
<body data-song="{{ID}}">
<div class="backdrop"></div>
<canvas id="scene"></canvas>

<div class="gate" role="button" aria-label="开始播放">
  <div class="gate-inner">
    <div class="gate-no"></div>
    <div class="gate-title"></div>
    <div class="gate-hint">Tap to play</div>
  </div>
</div>

<main>
  <div class="topbar rise"><span id="no"></span><a href="/#songs">Orphius · All songs</a></div>

  <div class="cover-wrap rise">
    <img id="cover" alt="" crossorigin="anonymous">
    <div class="cover-shade"></div>
    <section class="lyrics-box" id="lyricsBox" aria-label="歌词">
      <div class="lyrics-scroll" id="lyrics"></div>
    </section>
  </div>

  <div class="meta rise">
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  <div class="sub-switch rise" role="group" aria-label="Lyrics subtitles"><span class="sub-label">Subtitles</span><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="zh" lang="zh" aria-pressed="false">中文</button><button type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button></div>
  </div>

  <div class="player rise">
    <canvas id="viz"></canvas>
    <div class="bar"><div class="bar-track"></div><div class="bar-fill"></div><div class="bar-knob"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button class="ctl" id="back" aria-label="后退 10 秒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="ctl main" id="play" aria-label="播放 / 暂停">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.4-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>
      </button>
      <button class="ctl loop" id="loop" aria-label="单曲循环">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
  </div>

  <div class="links rise">{{LINKS}}<a class="lnk" href="/#songs">All songs</a></div>

  <section class="full-lyrics" aria-label="Lyrics">
    <h2 class="fl-head">{{TITLE}} lyrics</h2>
    <div class="sub-switch" role="group" aria-label="Lyrics subtitles"><span class="sub-label">Subtitles</span><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="zh" lang="zh" aria-pressed="false">中文</button><button type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button></div>
{{LYRICS}}
  </section>

  <div class="foot"><a href="/" style="color:inherit;text-decoration:none">Orphius · orphiusmusic.com</a></div>
</main>

<script src="/sub.js?v=2"></script>
<script src="/scene/songs.js?v=1"></script>
<script src="/scene/scene.js?v=1"></script>
<script src="/scene/player.js?v=3"></script>
</body>
</html>
